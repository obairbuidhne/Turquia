<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,217;1,217&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
    <title>Sign Up</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg">
</head>

<body>
    <header>
        <div class="logo">
            <a href="./index.html">
                <img src="./images/image copy.png" alt="Logo"></a>
        </div>
        <div class="ola-turquia">
            <h1>Olá, Turquia!</h1>
        </div>
    </header>

    <main>
        <div class="texto-principal">
            <div class="texto-principal">
                <h2 class="ei">Ei!</h2>
                <h3 class="pensou">Já pensou em <br> <span class="conhecer">conhecer tudo sobre</span><br><span class="turquia">a Turquia?</span></h3>
                <p>Pelo valor de <span class="valor">0 BRL</span> você consegue isso e<span class="muito-mais"><br> muito mais!</span></p>
            </div>
            

            <div class="formulario-cadastro">
                <h1>Cadastro</h1>
                <p class="login-link"> Já tem uma conta? <a href="../login.html">Faça o login!</a>
                </p>
                <form>
                    <input type="text" placeholder="Nome..." required />
                    <input type="text" placeholder="Sobrenome..." required/>
                    <input type="email" placeholder="Endereço de email..." required />
                    <input type="password" placeholder="Crie uma senha..." required />

                    <div class="novidades">
                        <h2>Quer acesso às novidades?</h2>
                        <p>Enviaremos para você as atualizações do site pelo seu email</p>
                        <label class="opcao">
                            <input type="radio" name="novidades" />
                            <span>Sim</span>
                        </label>
                        <label class="opcao">
                            <input type="radio" name="novidades" />
                            <span>Vou pensar</span>
                        </label>
                    </div>

                    <label class="termos">
                        <input type="checkbox" required/>
                        <p>Eu concordo com os <a href=>termos & condições</a> e as <a href=>políticas de
                                privacidade</a>.</p>
                    </label>

                    <button class="finalizar">Finalizar</button>
                </form>

            </div>

        </div>
    </main>
</body>

</html>
